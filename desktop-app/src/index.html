<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSteps Desktop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .header-text h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .header-text p {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .status-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #333;
      transition: all 0.3s;
    }

    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
    }

    .status-dot.connecting {
      background: #eab308;
      animation: pulse 1s infinite;
    }

    .status-dot.p2p {
      background: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      flex: 1;
    }

    .status-text .main {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    .status-text .sub {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }

    .p2p-badge {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      font-weight: 600;
      display: none;
    }

    .p2p-badge.active {
      display: inline-block;
    }

    .session-display {
      text-align: center;
      padding: 16px 0;
    }

    .session-code-box {
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .session-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .session-code {
      font-size: 32px;
      font-weight: 700;
      color: #22c55e;
      font-family: 'SF Mono', Monaco, monospace;
      letter-spacing: 6px;
    }

    .qr-container {
      margin: 16px 0;
    }

    .qr-container img {
      max-width: 160px;
      border-radius: 8px;
    }

    .phone-status {
      font-size: 12px;
      color: #888;
      margin-top: 12px;
    }

    .phone-status.connected {
      color: #22c55e;
    }

    .counter-section {
      text-align: center;
      padding: 24px 0;
    }

    .counter-value {
      font-size: 72px;
      font-weight: 800;
      color: #dc2626;
      font-family: 'SF Mono', Monaco, monospace;
      line-height: 1;
    }

    .counter-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
    }

    .toggle-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
      color: #ddd;
    }

    .toggle-desc {
      font-size: 11px;
      color: #555;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      transition: 0.3s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: linear-gradient(135deg, #dc2626, #991b1b);
    }

    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }

    .log-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .log-header {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .log-container {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      overflow-y: auto;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
    }

    .log-entry {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      color: #444;
      flex-shrink: 0;
      font-size: 10px;
    }

    .log-icon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      flex-shrink: 0;
    }

    .log-icon.info { background: rgba(59,130,246,0.2); color: #3b82f6; }
    .log-icon.success { background: rgba(34,197,94,0.2); color: #22c55e; }
    .log-icon.warning { background: rgba(234,179,8,0.2); color: #eab308; }
    .log-icon.error { background: rgba(239,68,68,0.2); color: #ef4444; }

    .log-message {
      flex: 1;
      color: #888;
      word-break: break-word;
    }

    .version {
      text-align: center;
      font-size: 10px;
      color: #333;
      margin-top: 16px;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <div class="logo">V</div>
      <div class="header-text">
        <h1>VSteps Desktop</h1>
        <p>Walk controller</p>
      </div>
    </div>

    <div class="card">
      <div class="status-section">
        <div class="status-dot connecting" id="statusDot"></div>
        <div class="status-text">
          <div class="main" id="statusText">Connecting...</div>
          <div class="sub" id="serverUrl">vsteps.org</div>
        </div>
        <span class="p2p-badge" id="p2pBadge">P2P</span>
      </div>

      <div class="session-display">
        <div class="session-code-box">
          <div class="session-label">Session Code</div>
          <div class="session-code" id="sessionCode">------</div>
        </div>
        <div class="qr-container">
          <img id="qrCodeImg" alt="QR Code" style="display: none;">
        </div>
        <div class="phone-status" id="phoneStatus">Waiting for phone...</div>
      </div>
    </div>

    <div class="card">
      <div class="counter-section">
        <div class="counter-value" id="stepCounter">0</div>
        <div class="counter-label">Steps</div>
      </div>
    </div>

    <div class="card">
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-label">Block Physical W Key</span>
          <span class="toggle-desc">Prevent double input while walking</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="disableWKeyToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="log-section">
      <div class="log-header">Connection Log</div>
      <div class="log-container" id="activityLog">
        <div class="log-entry">
          <span class="log-time">--:--:--</span>
          <span class="log-icon info">i</span>
          <span class="log-message">Starting...</span>
        </div>
      </div>
    </div>

    <div class="version">VSteps Desktop v2.1</div>
  </div>

  <script>
    try {
      const { vsteps } = window;

      if (!vsteps) {
        console.error('VSteps API not available');
      }

      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const serverUrl = document.getElementById('serverUrl');
      const p2pBadge = document.getElementById('p2pBadge');
      const sessionCode = document.getElementById('sessionCode');
      const qrCodeImg = document.getElementById('qrCodeImg');
      const phoneStatus = document.getElementById('phoneStatus');
      const stepCounter = document.getElementById('stepCounter');
      const disableWKeyToggle = document.getElementById('disableWKeyToggle');
      const activityLog = document.getElementById('activityLog');

      let isConnected = false;
      let reconnectTimeout = null;

      function addLogEntry(entry) {
        if (!activityLog) return;

        const iconMap = {
          info: 'i',
          success: 'o',
          warning: '!',
          error: 'x'
        };

        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry';
        logEntry.innerHTML = `
          <span class="log-time">${entry.timestamp || new Date().toLocaleTimeString()}</span>
          <span class="log-icon ${entry.type}">${iconMap[entry.type] || 'i'}</span>
          <span class="log-message">${entry.message}</span>
        `;

        activityLog.insertBefore(logEntry, activityLog.firstChild);

        while (activityLog.children.length > 50) {
          activityLog.removeChild(activityLog.lastChild);
        }
      }

      async function generateQRWithSession(sessionId) {
        try {
          const controllerUrl = `https://vsteps.org/controller?session=${sessionId}`;
          const result = await vsteps.generateQRCode(controllerUrl);

          if (result && result.success && result.dataUrl) {
            qrCodeImg.src = result.dataUrl;
            qrCodeImg.style.display = 'block';
          }
        } catch (err) {
          console.error('QR generation error:', err);
        }
      }

      vsteps.onSessionCreated && vsteps.onSessionCreated((data) => {
        sessionCode.textContent = data.sessionId;
        phoneStatus.textContent = 'Waiting for phone...';
        phoneStatus.classList.remove('connected');
        generateQRWithSession(data.sessionId);
      });

      vsteps.onPhoneConnected && vsteps.onPhoneConnected(() => {
        phoneStatus.textContent = 'Phone Connected';
        phoneStatus.classList.add('connected');
        addLogEntry({ type: 'success', message: 'Phone connected - start walking!' });
      });

      disableWKeyToggle.addEventListener('change', (e) => {
        vsteps.toggleDisableWKey(e.target.checked);
      });

      vsteps.onConnectionStatus((status) => {
        isConnected = status === 'connected';
        statusDot.classList.remove('connecting');

        if (reconnectTimeout) {
          clearTimeout(reconnectTimeout);
          reconnectTimeout = null;
        }

        if (status === 'error') {
          statusDot.classList.remove('connected');
          statusText.textContent = 'Reconnecting...';
          reconnectTimeout = setTimeout(() => {
            vsteps.connect('https://vsteps.org');
            statusDot.classList.add('connecting');
            statusText.textContent = 'Connecting...';
          }, 5000);
          return;
        }

        if (isConnected) {
          statusDot.classList.add('connected');
          statusText.textContent = 'Connected';
        } else {
          statusDot.classList.remove('connected', 'p2p');
          p2pBadge.classList.remove('active');
          statusText.textContent = 'Reconnecting...';
          reconnectTimeout = setTimeout(() => {
            vsteps.connect('https://vsteps.org');
            statusDot.classList.add('connecting');
            statusText.textContent = 'Connecting...';
          }, 5000);
        }
      });

      vsteps.onP2PStatus((status) => {
        if (status.connected) {
          statusDot.classList.add('p2p');
          p2pBadge.classList.add('active');
          statusText.textContent = 'P2P Connected';
        } else {
          statusDot.classList.remove('p2p');
          p2pBadge.classList.remove('active');
          if (isConnected) {
            statusText.textContent = 'Connected';
          }
        }
      });

      vsteps.onStats((stats) => {
        const total = (stats.forward || 0);
        stepCounter.textContent = total;
      });

      vsteps.onActivityLog((entry) => {
        addLogEntry(entry);
      });

      vsteps.onWKeyBlockStatus((status) => {
        if (!status.success) {
          disableWKeyToggle.checked = false;
          addLogEntry({ type: 'error', message: `W-key blocking failed: ${status.error}` });
        }
      });

      vsteps.getStatus();

    } catch (err) {
      console.error('VSteps UI initialization error:', err);
    }
  </script>
</body>
</html>
